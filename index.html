 {id:1,title:"Fase 1 · La taquilla de la estación",topic:"Criterios de divisibilidad",
  story:"Medianoche en Vitoria-Gasteiz. El Reloj de los Engranajes de la Dra. Ximena Primo, que mantiene sincronizados todos los faros del Anillo Verde, se ha parado. Alguien ha robado su <b>corazón dorado</b>. Una cámara grabó al ladrón —que firma como <b>«El Divisor»</b>— dejando una bolsa en una taquilla de la estación. Hay 50 taquillas. ¿En cuál está?",
  question:"¿Número de la taquilla?",type:"num",
  answer:{normal:"105",apoyo:"105"},
  params:{normal:{min:100,max:149},apoyo:{min:100,max:149}},
  docs:{
   A:"<div class='doc web'><h4>🌐 consignas-estacion-vitoria.eus</h4>Bienvenido al servicio de consignas. Nuestras taquillas están numeradas de la <b>100 a la 149</b>. ¡Gracias por viajar con nosotros!</div>",
   D:"<div class='doc mail'><h4>✉️ De: elDivisor@anonimo.zz · Asunto: la bolsa</h4>Socio: la dejé en una taquilla cuyo número <b>se puede dividir entre 5</b> de forma exacta. No pierdas tiempo.</div>",
   C:"<div class='doc'><h4>📄 Nota arrugada en una papelera</h4>«…y si <b>sumas sus cifras</b>, sale un <b>múltiplo de 3</b>. Así lo recordaré.»</div>",
   P:"<div class='doc mail'><h4>✉️ Respuesta del socio</h4>Recibido. Te recuerdo que las taquillas con número <b>par</b> están averiadas. Así que la tuya es <b>impar</b>, ¿no?</div>",
   T:"<div class='doc'><h4>🗂️ Informe del vigilante</h4>He revisado la cámara: al sumar las cifras de la taquilla <b>NO</b> sale un múltiplo de 9. Las demás pistas las tienen tus compañeros.</div>"},
  hints:["Juntad las 5 pistas. Cada una elimina números. Empezad por los múltiplos de 5 entre 100 y 149.","Múltiplos de 5 e impares: terminan en 5. Quedan 105, 115, 125, 135, 145. Ahora sumad cifras.","Solo 105 y 135 tienen suma de cifras múltiplo de 3 (6 y 9). ¿Cuál NO tiene suma múltiplo de 9?"],
  success:"¡Clic! Dentro de la taquilla 105 hay un sobre con cinco números y una tabla extraña…"},
 {id:2,title:"Fase 2 · El mensaje cifrado en primos",topic:"Descomposición en factores primos",
  story:"El sobre contiene un mensaje de El Divisor escrito con un cifrado que solo usa <b>números primos</b>. Cada miembro del equipo tiene un trozo. Descomponed cada número en factores primos, escribid los factores de <b>menor a mayor</b> y cambiadlos por letras. Uniendo los trozos en orden (1→5) sabréis dónde esconde el corazón del reloj.",
  question:"¿Palabra secreta?",type:"word",
  answer:{normal:"ENGRANAJES",apoyo:"ENGRANAJES"},
  params:{key:{"2":"A","3":"E","5":"G","7":"N","11":"J","13":"R","17":"S","19":"I","23":"O","29":"T"},pieces:{A:[1,21],D:[2,65],C:[3,14],P:[4,22],T:[5,51]}},
  docs:{
   A:"<div class='doc'><h4>🔐 Trozo 1 y tabla de cifrado</h4>Trozo 1: <span class='big1'>21</span><table><tr><th>Primo</th><td>2</td><td>3</td><td>5</td><td>7</td><td>11</td><td>13</td><td>17</td><td>19</td><td>23</td><td>29</td></tr><tr><th>Letra</th><td>A</td><td>E</td><td>G</td><td>N</td><td>J</td><td>R</td><td>S</td><td>I</td><td>O</td><td>T</td></tr></table><p class='small'>¡Tú tienes la tabla! Dictádsela al resto.</p></div>",
   D:"<div class='doc'><h4>🔐 Trozo 2</h4><span class='big1'>65</span><p class='small'>Archivo nº 2 de 5.</p></div>",
   C:"<div class='doc'><h4>🔐 Trozo 3</h4><span class='big1'>14</span><p class='small'>Archivo nº 3 de 5.</p></div>",
   P:"<div class='doc'><h4>🔐 Trozo 4</h4><span class='big1'>22</span><p class='small'>Archivo nº 4 de 5. Portavoz: apunta las letras en orden.</p></div>",
   T:"<div class='doc'><h4>🔐 Trozo 5</h4><span class='big1'>51</span><p class='small'>Archivo nº 5 de 5. Pista: 51 no es primo… prueba a dividir entre 3.</p></div>"},
  hints:["Descomponer = escribir el número como multiplicación de primos. Ej.: 15 = 3 × 5 → E G.","21 = 3 × 7 → E N. 65 = 5 × 13 → G R. Seguid con 14, 22 y 51.","14 = 2×7 (AN), 22 = 2×11 (AJ), 51 = 3×17 (ES). Unidlo todo: EN·GR·AN·AJ·ES."],
  success:"«ENGRANAJES». El corazón está en el taller de engranajes del reloj… pero para entrar hay que descubrir el mensaje de la rejilla secreta."},
 {id:3,label:"F3",title:"Fase 3 · La rejilla secreta (prueba impresa)",topic:"Lógica visual y cooperación",physical:true,
  story:"En el taller hay una hoja llena de letras sin sentido: es una <b>rejilla de Cardano</b>, el truco de los espías del Renacimiento. El Divisor la dejó para su socio. La cuadrícula de letras la tiene el/la Técnico/a; cada uno de los otros cuatro agentes tiene una plantilla con ventanas. Solo colocando las cuatro plantillas, en el orden correcto, aparece el mensaje.",
  question:"¿Qué mensaje aparece? (sin espacios)",type:"word",
  answer:{normal:"ALMACENFAROS",apoyo:"ALMACENFAROS"},params:{rejilla:{"size": 6, "grid": "HGPIGAJTNGADRCFJYVQXXTOALPKCSEIMKDPZ", "holes": {"D": [10, 24, 31], "P": [5, 27, 29], "A": [8, 14, 23], "C": [12, 22, 28]}, "symbols": {"D": "☾", "P": "★", "A": "☀", "C": "⚙"}, "order": ["☾", "★", "☀", "⚙"], "answer": "ALMACENFAROS"}},
  docs:{A:"<div class='doc'><h4>🧩 Tu pieza: la rejilla ☀</h4>Busca en el material impreso la <b>rejilla ☀</b>. Recorta sus <b>3 ventanas</b> sombreadas (dobla el papel por la ventana y corta). Ponla encima de la cuadrícula del Técnico/a, con los dos <b>triángulos ▲ en la misma esquina</b>, y lee las letras que se ven, de izquierda a derecha y de arriba abajo.</div>",D:"<div class='doc'><h4>🧩 Tu pieza: la rejilla ☾</h4>Busca en el material impreso la <b>rejilla ☾</b>. Recorta sus <b>3 ventanas</b> sombreadas (dobla el papel por la ventana y corta). Ponla encima de la cuadrícula del Técnico/a, con los dos <b>triángulos ▲ en la misma esquina</b>, y lee las letras que se ven, de izquierda a derecha y de arriba abajo.</div>",C:"<div class='doc'><h4>🧩 Tu pieza: la rejilla ⚙</h4>Busca en el material impreso la <b>rejilla ⚙</b>. Recorta sus <b>3 ventanas</b> sombreadas (dobla el papel por la ventana y corta). Ponla encima de la cuadrícula del Técnico/a, con los dos <b>triángulos ▲ en la misma esquina</b>, y lee las letras que se ven, de izquierda a derecha y de arriba abajo.</div>",P:"<div class='doc'><h4>🧩 Tu pieza: la rejilla ★</h4>Busca en el material impreso la <b>rejilla ★</b>. Recorta sus <b>3 ventanas</b> sombreadas (dobla el papel por la ventana y corta). Ponla encima de la cuadrícula del Técnico/a, con los dos <b>triángulos ▲ en la misma esquina</b>, y lee las letras que se ven, de izquierda a derecha y de arriba abajo.</div>",
   T:"<div class='doc'><h4>🛠️ Tu pieza: la cuadrícula de letras</h4>Tienes la <b>cuadrícula 6 × 6</b> impresa con el triángulo ▲ en una esquina. Ponla en la mesa y dirige: cada compañero coloca su rejilla encima, alineando los ▲, y dicta sus 3 letras. Debajo de tu cuadrícula está el <b>orden de lectura</b> de las rejillas. El/la Portavoz apunta las letras.</div>"},
  hints:["Alinead bien: el triángulo ▲ de la rejilla tiene que quedar encima del ▲ de la cuadrícula, sin girarla.","Cada rejilla da 3 letras. El orden de las rejillas está impreso debajo de la cuadrícula del Técnico/a: ☾ → ★ → ☀ → ⚙.","Las primeras rejillas dan A L M · A C E… Son dos palabras juntas: un edificio y lo que tiene la ciudad en el Anillo Verde."],
  success:"«ALMACÉN FAROS». ¡Ya sabéis adónde se llevó El Divisor el corazón! Pero la trampilla del taller se ha cerrado tras vosotros…"},
 {id:3.5,label:"F3b",title:"Fase 3b · Los engranajes de la trampilla",topic:"Mínimo común múltiplo (mcm)",
  story:"Para salir del taller hay que mover dos engranajes encajados. Cada uno tiene un diente con una <b>marca roja</b> y ahora las dos marcas están juntas. La trampilla se abre cuando, girando, las dos marcas vuelvan a juntarse por primera vez. ¿Cuántos dientes tienen que pasar?",
  question:"¿Cuántos dientes pasan hasta que las marcas vuelven a coincidir?",type:"num",
  answer:{normal:"24",apoyo:"24"},params:{normal:[6,8],apoyo:[6,8]},
  docs:{
   A:"<div class='doc'><h4>⚙️ Engranaje pequeño</h4>Tiene <b>{0} dientes</b>. Su marca vuelve a su sitio cada {0} dientes.</div>",
   D:"<div class='doc'><h4>📚 Manual del taller</h4>«Dos engranajes encajados avanzan el mismo número de dientes. Las marcas coinciden cuando ese número es <b>múltiplo de los dos</b>. La primera vez: el <b>mcm</b>.»</div>",
   C:"<div class='doc'><h4>⚙️ Engranaje grande</h4>Tiene <b>{1} dientes</b>. Escribe sus múltiplos y compáralos con los del pequeño.</div>",
   P:"<div class='doc'><h4>📣 Misión del portavoz</h4>Pide a cada compañero su dato. Comprobad el resultado de dos formas: con listas de múltiplos y con factores primos.</div>",
   T:"<div class='doc'><h4>🛠️ Esquema</h4><svg viewBox='0 0 260 130' width='100%' style='max-width:380px' role='img' aria-label='Dos engranajes encajados, uno pequeño y uno grande, con una marca cada uno'><circle cx='80' cy='65' r='40' fill='#c9a24a' stroke='#5a4a2a' stroke-width='6' stroke-dasharray='10 10'/><circle cx='175' cy='65' r='52' fill='#9db4d8' stroke='#2a3a5a' stroke-width='6' stroke-dasharray='10 10'/><text x='80' y='70' text-anchor='middle' font-size='16'>pequeño</text><text x='175' y='70' text-anchor='middle' font-size='16'>grande</text><text x='118' y='60' font-size='18'>▼</text></svg><br>La marca ▼ está donde se tocan. Contad dientes, no vueltas.</div>"},
  hints:["Si pasan 6 dientes, el pequeño da una vuelta; si pasan 8, el grande da una vuelta. ¿Cuándo dan vueltas completas los dos a la vez?","Múltiplos de 6: 6, 12, 18, 24… Múltiplos de 8: 8, 16, 24…","6 = 2·3 y 8 = 2³ → mcm = 2³·3 = 24 dientes (4 vueltas del pequeño y 3 del grande)."],
  success:"¡Clac! Las marcas se juntan y la trampilla se abre…",
  cliff:"…pero el taller está vacío. Solo hay una nota con letra torcida: <i>«Llegáis tarde, agentes. Ya estoy en el almacén de los faros. Esta noche, cuando los tres faros brillen a la vez, desapareceré para siempre. — El Divisor»</i><br><br>🌙 <b>FIN DE LA SESIÓN 1.</b> Guardad el secreto… ¡y volved preparados!",
  extra:"🚀 Modo reto: ¿cuántas vueltas habrá dado cada engranaje? ¿Y si hubiera un tercero de 10 dientes?"},
 {id:4,title:"Fase 4 · La base de datos del almacén",topic:"Máximo común divisor (mcd)",
  story:"Para cruzar el Anillo Verde de noche hacen falta kits de rescate. El almacén tiene linternas, cuerdas y brújulas. Hay que preparar el <b>mayor número posible de kits iguales</b>, sin que sobre nada. Cada agente tiene acceso a una tabla distinta de la base de datos.",
  question:"¿Cuántos kits iguales como máximo?",type:"num",
  answer:{normal:"42",apoyo:"6"},params:{normal:[84,126,210],apoyo:[12,18,30]},
  docs:{
   A:"<div class='doc db'><h4>🗄️ SELECT * FROM linternas;</h4>cantidad = <b>{0}</b></div>",
   D:"<div class='doc db'><h4>🗄️ SELECT * FROM cuerdas;</h4>cantidad = <b>{1}</b></div>",
   C:"<div class='doc db'><h4>🗄️ SELECT * FROM brujulas;</h4>cantidad = <b>{2}</b></div>",
   P:"<div class='doc mail'><h4>✉️ De: Dra. Ximena Primo</h4>Agentes: todos los kits deben ser <b>idénticos</b> y no puede <b>sobrar</b> nada. Necesitamos <b>el máximo número</b> de kits. Pedid los datos a vuestro equipo.</div>",
   T:"<div class='doc'><h4>🛠️ Ficha de método</h4>El número de kits debe <b>dividir</b> exactamente a las tres cantidades. Buscad el <b>divisor común más grande</b>: descomponed en factores primos y quedaos con los factores <b>comunes</b> con el <b>menor</b> exponente.</div>"},
  hints:["El número de kits tiene que ser divisor de las tres cantidades a la vez.","Descomponed las tres cantidades en factores primos y buscad qué factores aparecen en las tres.","Normal: 84=2²·3·7, 126=2·3²·7, 210=2·3·5·7 → mcd=2·3·7. Apoyo: 12=2²·3, 18=2·3², 30=2·3·5 → mcd=2·3."],
  success:"¡Kits listos! Cada agente coge el suyo. Desde lo alto se ven tres faros parpadeando…"},
 {id:4.5,label:"F4b",title:"Fase 4b · La discoteca de El Divisor (minijuego de ritmo)",topic:"Múltiplos comunes y mcm · ¡a ritmo!",mini:true,
  story:"Sorpresa: el almacén tiene una puerta secreta… ¡a una <b>discoteca</b> escondida bajo el faro! 🪩 El Divisor está en la pista intentando bailar, pero es un desastre: <i>«¡Yo divido la pista y nadie quiere bailar conmigo!»</i>. La puerta de salida solo se abre si el equipo sigue el ritmo: hay una <b>luz roja ●</b> y una <b>luz azul ■</b> que se encienden cada cierto número de golpes. ¡Dad palmadas todos juntos, pulsad en vuestro momento y averiguad cada cuántos golpes se encienden las dos a la vez!",
  question:"¿Cada cuántos golpes se encienden las dos luces a la vez?",type:"num",
  answer:{normal:"12",apoyo:"6"},params:{normal:[3,4],apoyo:[2,3]},speed:{normal:650,apoyo:950},
  docs:{
   A:"<div class='doc'><h4>● Eres la LUZ ROJA</h4>La luz roja se enciende cada <b>{0} golpes</b>. Tu tarea: dar una <b>palmada</b> y pulsar «¡AHORA!» cada vez que se enciende la luz roja.</div>",
   D:"<div class='doc'><h4>📚 Normas de la discoteca</h4>«La puerta se abre cuando el equipo pulsa <b>justo cuando se encienden las dos luces a la vez</b>.» Tu tarea: pulsar «¡AHORA!» solo en esos golpes dobles y gritar <b>«¡FARO!»</b>.</div>",
   C:"<div class='doc'><h4>■ Eres la LUZ AZUL</h4>La luz azul se enciende cada <b>{1} golpes</b>. Tu tarea: dar un <b>golpe en la mesa</b> y pulsar «¡AHORA!» cada vez que se enciende la luz azul.</div>",
   P:"<div class='doc'><h4>📣 DJ del equipo</h4>Tú <b>cuentas los golpes en voz alta</b> (1, 2, 3…) y apuntas en qué golpes coinciden las dos luces. Pulsa «¡AHORA!» en los golpes dobles.</div>",
   T:"<div class='doc'><h4>🛠️ Técnico/a de luces</h4>En los golpes en que se encienden las dos luces, haz un <b>pisotón</b> (¡o un paso de baile!) y pulsa «¡AHORA!». Ayuda al DJ a comprobar el patrón.</div>"},
  hints:["Fijaos en qué golpes se enciende cada luz. Apuntadlos en dos listas.","Normal: roja en 3, 6, 9, 12… azul en 4, 8, 12… Apoyo: roja en 2, 4, 6… azul en 3, 6…","Es el mcm: normal mcm(3,4)=12; apoyo mcm(2,3)=6."],
  success:"🪩 ¡La pista explota de luz! El Divisor resbala con su propia bola de discoteca y confiesa: <i>«Vale, vale… robé el corazón porque NUNCA me invitan a la fiesta de los múltiplos comunes»</i>. Y, ¡zas!, se escapa entre la gente… a una fiesta de disfraces.",
  extra:"🚀 Modo reto: si hubiera una tercera luz verde ▲ cada 5 golpes, ¿en qué golpe se encenderían las tres a la vez? (Respuesta: mcm(3,4,5) = 60)"},
 {id:4.7,label:"F4c",title:"Fase 4c · La fiesta de disfraces (lógica y observación)",topic:"Lógica deductiva · sin números",lineup:true,
  story:"El Divisor se ha colado en la fiesta de disfraces del faro. Hay <b>6 invitados sospechosos</b> y solo uno es él. Cada agente ha hablado con un testigo distinto. Juntad los cinco testimonios y descubrid quién es. ¡Ojo: cada testimonio descarta a alguien!",

  docs:{

 $("tmode").onclick=()=>{S.mode=mode==="apoyo"?"normal":"apoyo";save();$("modal").style.display="none";render()};$("tout").onclick=()=>{$("modal").style.display="none";login()};
 $("treset").onclick=()=>{localStorage.removeItem(PREFIX+S.team+"-"+S.role);$("modal").style.display="none";login()}}
 $("tall").onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith(PREFIX)).forEach(k=>localStorage.removeItem(k));$("modal").style.display="none";login()}})}
$("bMute").onclick=()=>{muted=!muted;localStorage.setItem(PREFIX+"muted",muted?"1":"0");hdr()};
$("bTeacher").onclick=teacher;
$("bA11y").onclick=()=>{const a=a11y();modal(`<h2>Aa Accesibilidad</h2><p><label><input type="checkbox" id="xbig" ${a.big?"checked":""} style="width:auto"> Letra grande</label></p><p><label><input type="checkbox" id="xhc" ${a.hc?"checked":""} style="width:auto"> Alto contraste</label></p><p><label><input type="checkbox" id="xdys" ${a.dys?"checked":""} style="width:auto"> Fuente para dislexia / más espaciado</label></p>`);["big","hc","dys"].forEach(k=>$("x"+k).onchange=e=>{a[k]=e.target.checked;localStorage.setItem(PREFIX+"a11y",JSON.stringify(a));a11y()})};
$("bTimer").onclick=()=>{timerOn=!timerOn;if(!timerOn)$("timer").textContent=""};
setInterval(()=>{if(timerOn&&S){const st=S.s2?S.session2Start:S.sessionStart;const s=Math.floor((Date.now()-st)/1000);$("timer").textContent=`⏱️ ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} / 60:00`}},1000);
a11y();login();
</script></body></html>
